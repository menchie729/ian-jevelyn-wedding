<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jan & Jevelyn Wedding</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Georgia,serif;
  background:linear-gradient(135deg,#FDF8FF,#F6EEFF);
  color:#4B2E5A;
  line-height:1.6;
}
.wrapper{
  max-width:600px;
  margin:0 auto;
  padding:18px;
}
.card{
  position:relative;
  background:#fffef9;
  border:2px solid #D4AF37;
  border-radius:12px;
  padding:22px 18px 18px;
  overflow:hidden;
}
/* TOP PHOTO */
.photo-frame{
  width:100%;
  height:240px;
  border-radius:8px;
  overflow:hidden;
  border:1px solid #D4AF37;
  margin-bottom:18px;
}
.photo-frame img{
  width:100%;
  height:100%;
  object-fit:cover;
}
/* FLOWER DECOR */
.flower-corner{
  position:absolute;
  width:120px;
  height:120px;
  pointer-events:none;
  z-index:2;
}
.flower-tl{
  top:0;
  left:0;
  background:radial-gradient(circle at 20% 20%,#9B59B6 0%,#8E44AD 25%,#7D3C98 45%,transparent 70%),
              radial-gradient(circle at 50% 10%,#fff 0%,transparent 50%),
              radial-gradient(circle at 10% 50%,#F7DC6F 0%,#D4AF37 35%,transparent 60%);
  clip-path:polygon(0 0,65% 0,65% 65%,0 65%);
}
.flower-tr{
  top:0;
  right:0;
  background:radial-gradient(circle at 80% 20%,#9B59B6 0%,#8E44AD 25%,#7D3C98 45%,transparent 70%),
              radial-gradient(circle at 50% 10%,#fff 0%,transparent 50%),
              radial-gradient(circle at 90% 50%,#F7DC6F 0%,#D4AF37 35%,transparent 60%);
  clip-path:polygon(35% 0,100% 0,100% 65%,35% 65%);
}
.flower-bl{
  bottom:0;
  left:0;
  background:radial-gradient(circle at 20% 80%,#9B59B6 0%,#8E44AD 25%,#7D3C98 45%,transparent 70%),
              radial-gradient(circle at 50% 90%,#fff 0%,transparent 50%),
              radial-gradient(circle at 10% 50%,#F7DC6F 0%,#D4AF37 35%,transparent 60%);
  clip-path:polygon(0 35%,65% 35%,65% 100%,0 100%);
}
.flower-br{
  bottom:0;
  right:0;
  background:radial-gradient(circle at 80% 80%,#9B59B6 0%,#8E44AD 25%,#7D3C98 45%,transparent 70%),
              radial-gradient(circle at 50% 90%,#fff 0%,transparent 50%),
              radial-gradient(circle at 90% 50%,#F7DC6F 0%,#D4AF37 35%,transparent 60%);
  clip-path:polygon(35% 35%,100% 35%,100% 100%,35% 100%);
}
/* TEXT */
.top-text{
  font-size:0.9rem;
  text-align:center;
  color:#6C3483;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:8px;
}
.invite-text{
  font-size:1rem;
  text-align:center;
  color:#6C3483;
  margin-bottom:12px;
}
.names{
  font-size:2.4rem;
  font-weight:bold;
  color:#7D3C98;
  text-align:center;
  font-style:italic;
  margin-bottom:12px;
}
.and-text{
  font-size:1.2rem;
  color:#D4AF37;
  display:block;
  margin:6px 0;
}
.details{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  text-align:center;
  margin:18px 0;
  font-size:0.95rem;
  color:#6C3483;
}
.detail-item{
  padding:10px;
  border:1px solid #eee;
  border-radius:8px;
  background:#fffafd;
}
.detail-item i{
  color:#D4AF37;
  font-size:1.1rem;
  display:block;
  margin-bottom:4px;
}
.bottom-text{
  text-align:center;
  font-size:0.95rem;
  color:#6C3483;
  margin-bottom:12px;
}
.btn{
  display:block;
  width:100%;
  max-width:260px;
  margin:0 auto;
  background:linear-gradient(135deg,#8E44AD,#D4AF37);
  color:white;
  text-decoration:none;
  padding:12px;
  border-radius:8px;
  text-align:center;
  font-size:1rem;
}
.btn:hover{
  background:linear-gradient(135deg,#7D3C98,#C49A2F);
}
@media (min-width:768px){
  .card{
    padding:30px 24px 24px;
  }
  .photo-frame{
    height:280px;
  }
  .names{
    font-size:3.2rem;
  }
  .details{
    font-size:1rem;
  }
}
</style>
</head>
<body>

    <div class="photo-frame">
      <!-- I-upload ang imong couple photo sa GitHub repo ug ilisi ang src filename -->

    </p>

  </div>
</div>

</body>
</html>
