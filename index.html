<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ian & Jevelyn Wedding Invitation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Georgia, 'Times New Roman', serif;
}

.bg{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:linear-gradient(135deg, #FDF8FF, #EDE4F7);
  z-index:0;
}

.flower{
  position:absolute;
  width:130px;
  height:130px;
  z-index:6;
  pointer-events:none;
}
.flower-tl{
  top:0;
  left:0;
  background:
    radial-gradient(ellipse 50% 40% at 25% 25%, #9B59B6 0%, #8E44AD 40%, transparent 70%),
    radial-gradient(ellipse 40% 50% at 45% 20%, #B977D1 0%, #9B59B6 40%, transparent 70%),
    radial-gradient(circle at 35% 40%, #F7DC6F 0%, #D4AF37 40%, transparent 60%),
    radial-gradient(circle at 20% 35%, #fff 0%, transparent 50%);
  clip-path:polygon(0 0, 70% 0, 70% 70%, 0 70%);
}
.flower-tr{
  top:0;
  right:0;
  background:
    radial-gradient(ellipse 50% 40% at 75% 25%, #9B59B6 0%, #8E44AD 40%, transparent 70%),
    radial-gradient(ellipse 40% 50% at 55% 20%, #B977D1 0%, #9B59B6 40%, transparent 70%),
    radial-gradient(circle at 65% 40%, #F7DC6F 0%, #D4AF37 40%, transparent 60%),
    radial-gradient(circle at 80% 35%, #fff 0%, transparent 50%);
  clip-path:polygon(30% 0, 100% 0, 100% 70%, 30% 70%);
}
.flower-bl{
  bottom:0;
  left:0;
  background:
    radial-gradient(ellipse 50% 40% at 25% 75%, #9B59B6 0%, #8E44AD 40%, transparent 70%),
    radial-gradient(ellipse 40% 50% at 45% 80%, #B977D1 0%, #9B59B6 40%, transparent 70%),
    radial-gradient(circle at 35% 60%, #F7DC6F 0%, #D4AF37 40%, transparent 60%),
    radial-gradient(circle at 20% 65%, #fff 0%, transparent 50%);
  clip-path:polygon(0 30%, 70% 30%, 70% 100%, 0 100%);
}
.flower-br{
  bottom:0;
  right:0;
  background:
    radial-gradient(ellipse 50% 40% at 75% 75%, #9B59B6 0%, #8E44AD 40%, transparent 70%),
    radial-gradient(ellipse 40% 50% at 55% 80%, #B977D1 0%, #9B59B6 40%, transparent 70%),
    radial-gradient(circle at 65% 60%, #F7DC6F 0%, #D4AF37 40%, transparent 60%),
    radial-gradient(circle at 80% 65%, #fff 0%, transparent 50%);
  clip-path:polygon(30% 30%, 100% 30%, 100% 100%, 30% 100%);
}

.frame-outer{
  position:absolute;
  top:15px;left:15px;right:15px;bottom:15px;
  border:2px solid #D4AF37;
  border-radius:10px;
  z-index:2;
}
.frame-inner{
  position:absolute;
  top:25px;left:25px;right:25px;bottom:25px;
  border:1px solid rgba(212,175,55,0.4);
  border-radius:6px;
  z-index:2;
}

.content{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:5;
  width:90%;
  max-width:480px;
}

/* Photo area — gamay ra para dili molabig */
.photo-container{
  width:100%;
  max-width:260px;
  height:190px;
  border-radius:8px;
  border:2px solid #D4AF37;
  overflow:hidden;
  margin:0 auto 18px;
  background:#F6EEFF;
  display:flex;
  align-items:center;
  justify-content:center;
}
.photo-container img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.names{
  font-size:clamp(2.4rem,8vw,3.4rem);
  color:#7D3C98;
  font-style:italic;font-weight:bold;
  margin-bottom:5px;line-height:1.2;
}
.and{color:#D4AF37;display:block;margin:4px 0;font-size:1.3rem;}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:15px 0;}
.d-line{width:70px;height:1px;background:linear-gradient(90deg,transparent,#D4AF37,transparent);}
.d-heart{width:12px;height:12px;background:#D4AF37;transform:rotate(45deg);border-radius:2px 0 0 0;}

.top-text{font-size:0.9rem;text-transform:uppercase;letter-spacing:1.5px;color:#6C3483;margin-bottom:5px;}
.invite-text{font-size:0.95rem;color:#6C3483;margin-bottom:15px;}
.details-row{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;margin:20px 0;}
.detail-col{flex:1;min-width:110px;}
.detail-icon{font-size:1.1rem;color:#D4AF37;margin-bottom:4px;}
.detail-text{font-size:0.9rem;color:#6C3483;line-height:1.5;}
.bottom-msg{font-style:italic;color:#6C3483;margin-top:8px;font-size:0.95rem;}

.page{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:1;}
.page.active{display:block;}

.nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:15px;z-index:10;}
.nav button{
  background:linear-gradient(135deg,#8E44AD,#D4AF37);
  color:white;border:none;padding:10px 24px;
  font-size:0.95rem;border-radius:6px;cursor:pointer;
}
</style>
</head>
<body>

<!-- PAGE 1 -->
<section class="page active" id="p1">
  <div class="bg"></div>
  <div class="flower flower-tl"></div>
  <div class="flower flower-tr"></div>
  <div class="flower flower-bl"></div>
  <div class="flower flower-br"></div>
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <div class="content">
    <p class="top-text">Together with their families</p>
    <p class="invite-text">You are cordially invited to the wedding of</p>
    <h1 class="names">
      Ian
      <span class="and">and</span>
      Jevelyn
    </h1>
    <div class="divider">
      <span class="d-line"></span>
      <span class="d-heart"></span>
      <span class="d-line"></span>
    </div>
    <p class="bottom-msg">Swipe or tap Next to continue</p>
  </div>

  <div class="nav">
    <button onclick="prevPage()">PREV</button>
    <button onclick="nextPage()">NEXT</button>
  </div>
</section>

<!-- PAGE 2 — Photo & Names -->
<section class="page" id="p2">
  <div class="bg"></div>
  <div class="flower flower-tl"></div>
  <div class="flower flower-tr"></div>
  <div class="flower flower-bl"></div>
  <div class="flower flower-br"></div>
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <div class="content">
    <div class="photo-container">
      <img src="https://i.postimg.cc/0QqZb3Kt/couple.jpg" alt="Ian & Jevelyn">
    </div>
    <h1 class="names" style="font-size:clamp(2rem,6vw,2.8rem);">
      Ian
      <span class="and">and</span>
      Jevelyn
    </h1>
    <div class="divider">
      <span class="d-line"></span>
      <span class="d-heart"></span>
      <span class="d-line"></span>
    </div>
  </div>

  <div class="nav">
    <button onclick="prevPage()">PREV</button>
    <button onclick="nextPage()">NEXT</button>
  </div>
</section>

<!-- PAGE 3 -->
<section class="page" id="p3">
  <div class="bg"></div>
  <div class="flower flower-tl"></div>
  <div class="flower flower-tr"></div>
  <div class="flower flower-bl"></div>
  <div class="flower flower-br"></div>
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <div class="content">
    <h2 style="font-size:1.4rem;color:#7D3C98;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;">When & Where</h2>
    <div class="divider">
      <span class="d-line"></span>
      <span class="d-heart"></span>
      <span class="d-line"></span>
    </div>
    <div class="details-row">
      <div class="detail-col">
        <div class="detail-icon">📅</div>
        <div class="detail-text">October 5, 2026</div>
        <div class="detail-text">Monday</div>
      </div>
      <div class="detail-col">
        <div class="detail-icon">⏰</div>
        <div class="detail-text">2:00 PM</div>
      </div>
      <div class="detail-col">
        <div class="detail-icon">📍</td>
        <div class="detail-text">Old Stone Inn</div>
        <div class="detail-text">Canada</div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button onclick="prevPage()">PREV</button>
    <button onclick="nextPage()">NEXT</button>
  </div>
</section>

<!-- PAGE 4 -->
<section class="page" id="p4">
  <div class="bg"></div>
  <div class="flower flower-tl"></div>
  <div class="flower flower-tr"></div>
  <div class="flower flower-bl"></div>
  <div class="flower flower-br"></div>
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <div class="content">
    <h2 style="font-size:1.4rem;color:#7D3C98;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;">With Love</point>
    <div class="divider">
      <span class="d-line"></span>
      <span class="d-heart"></span>
      <span class="d-line"></span>
    </div>
    <p class="bottom-msg" style="font-size:1.1rem;line-height:1.8;">
      "Two souls, one heart."<br><br>
      We look forward to celebrating
   
    </div>
  </div>
</section>

<script>
let currentPage = 1;
let totalPages = 4;
function showPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('p'+p).classList.add('active');
  currentPage=p;
}
function nextPage(){if(currentPage<totalPages)showPage(currentPage+1);}
function prevPage(){if(currentPage>1)showPage(currentPage-1);}
</script>

</body>
</html>
